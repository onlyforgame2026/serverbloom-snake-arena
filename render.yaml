services:
  - type: web
    name: serverbloom-snake-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: MAX_PLAYERS
        value: 12
      - key: COUNTDOWN_SECONDS
        value: 7
